name: integration-tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  integration-tests:
    name: integration tests with real APIs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: bedrock_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - name: go mod download
        run: go mod download

      - name: run migrations
        env:
          PGPASSWORD: test
        run: psql -h localhost -U test -d bedrock_test -f db/migrations/000001_create_users_table.up.sql

      - name: build server
        run: go build -o /tmp/bedrock-server ./bedrock_server

      - name: start bedrock server
        env:
          DATABASE_URL: "postgres://test:test@localhost:5432/bedrock_test"
          JWT_SECRET: "test-secret-key-for-ci"
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SOUNDCLOUD_CLIENT_ID: ${{ secrets.SOUNDCLOUD_CLIENT_ID }}
        run: |
          /tmp/bedrock-server &
          sleep 5
          kill -0 $! || (echo "server failed to start" && exit 1)

      - name: run integration tests
        env:
          DATABASE_URL: "postgres://test:test@localhost:5432/bedrock_test"
          JWT_SECRET: "test-secret-key-for-ci"
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SOUNDCLOUD_CLIENT_ID: ${{ secrets.SOUNDCLOUD_CLIENT_ID }}
        run: go test -v -timeout 120s ./tests/...
